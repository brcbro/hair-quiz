<!DOCTYPE html>
<html>
<head>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color: #2C2C2A; max-width: 680px; margin: 0 auto; width: 100%; }

/* ── STICKY SECTION NAV ── */
.lll-nav {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 680px;
  z-index: 99999;
  background: rgba(255,255,255,0.97);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 0.5px solid #D3D1C7;
  padding: 0 16px;
  display: flex; align-items: stretch;
}
.lll-nav-item {
  flex: 1; text-align: center;
  padding: 11px 4px 9px;
  color: #B4B2A9;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s;
  white-space: nowrap;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.lll-nav-item.active { color: #2C2C2A; border-bottom-color: #C69352; }
.lll-nav-item.done { color: #888780; }
.lll-nav-num { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.lll-nav-title { font-size: 11px; font-weight: 400; }
.lll-nav-item.active .lll-nav-num { color: #C69352; }

/* ── SECTION 1 ── */
#section-profile {
  background-color: #F1EFE8;
  padding-top: 52px;
}
#octane-quiz-outer-wrapper {
  padding-top: 0 !important;
}

/* ── SECTION DIVIDER ── */
.lll-section-divider { padding: 16px 16px 18px; }
.lll-section-step { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #C69352; margin-bottom: 4px; }
.lll-section-title { font-size: 26px; font-weight: 600; color: #2C2C2A; line-height: 1.2; }
.lll-section-diagnosis { font-size: 22px; font-weight: 400; color: #2C2C2A; line-height: 1.3; margin-top: 2px; }

/* ── SECTION 1 CONTENT ── */
.lll-profile { padding: 0 16px 8px; }
.lll-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.lll-pill { display: inline-flex; align-items: center; gap: 5px; background: white; border-radius: 20px; padding: 4px 10px; font-size: 11px; color: #5F5E5A; }
.lll-pill strong { color: #2C2C2A; font-weight: 500; }
.lll-summary { background: white; border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
.lll-summary p { font-size: 13px; color: #2C2C2A; line-height: 1.7; }
.lll-proof { border-left: 2px solid #D85A30; padding: 8px 14px; margin-bottom: 20px; }
.lll-proof p { font-size: 13px; color: #5F5E5A; line-height: 1.6; font-style: italic; }
.lll-proof-name { font-size: 11px; color: #888780; font-style: normal; margin-top: 6px; }
</style>
</head>
<body>

<!-- STICKY NAV -->
<nav class="lll-nav" id="lll-nav">
  <div class="lll-nav-item active" id="lll-nav-profile" onclick="lllScrollTo('section-profile')">
    <span class="lll-nav-num">1</span>
    <span class="lll-nav-title">Hair Profile</span>
  </div>
  <div class="lll-nav-item" id="lll-nav-products" onclick="lllScrollTo('section-products')">
    <span class="lll-nav-num">2</span>
    <span class="lll-nav-title">Products</span>
  </div>
  <div class="lll-nav-item" id="lll-nav-routine" onclick="lllScrollTo('section-routine')">
    <span class="lll-nav-num">3</span>
    <span class="lll-nav-title">Routine</span>
  </div>
</nav>

<!-- SECTION 1: HAIR PROFILE -->
<div id="section-profile">

  <div class="lll-section-divider">
    <p class="lll-section-step">Section 1 of 3</p>
    <p class="lll-section-title">Your Hair Profile:</p>
    <p class="lll-section-diagnosis" id="headline">Dry fine hair</p>
  </div>

  <div class="lll-profile">
    <div class="lll-pills">
      <span class="lll-pill">Hair type <strong id="val-hairtype"></strong></span>
      <span class="lll-pill">Frustration <strong id="val-frustration">Dry hair</strong></span>
      <span class="lll-pill">Damage <strong id="val-damage">&mdash;</strong></span>
      <span class="lll-pill">Heat tools <strong id="val-heat">&mdash;</strong></span>
      <span class="lll-pill">Volume preference <strong id="val-volume">Smooth &amp; sleek</strong></span>
    </div>

    <div class="lll-summary">
      <p id="summary-text"></p>
    </div>

    <div class="lll-proof">
      <p id="testimonial-text"></p>
      <p class="lll-proof-name" id="testimonial-name"></p>
    </div>
  </div>

</div>

<script>
/* ─────────────────────────────────────────────
   HEAT TOOL DISPLAY LABELS
───────────────────────────────────────────── */
var HEAT_LABELS = {
  blow_dryer: 'Blow Dryer or Blow Dryer Brush',
  iron:       'Flat Iron, Curling Iron or Wand',
  both:       'Blow Dryer and Iron',
  none:       'None'
};

/* ─────────────────────────────────────────────
   VOLUME DISPLAY LABELS
───────────────────────────────────────────── */
var VOLUME_LABELS = {
  max:      'Full volume',
  moderate: 'Soft lift',
  none:     'Smooth & sleek'
};

/* ─────────────────────────────────────────────
   FRUSTRATION PILL LABELS
   Keys match lowercase hair_pain_point values
───────────────────────────────────────────── */
var FRUSTRATION_LABELS = {
  dry:    { Mild: 'Mildly dry hair',       Moderate: 'Moderately dry hair',       Severe: 'Severely dry hair'       },
  frizzy: { Mild: 'Mild frizz',            Moderate: 'Moderate frizz',            Severe: 'Severe frizz'            },
  growth: { Mild: 'Mild breakage',         Moderate: 'Moderate breakage',         Severe: 'Severe breakage'         },
  oily:   { Mild: 'Mildly oily scalp',     Moderate: 'Moderately oily scalp',     Severe: 'Severely oily scalp'     },
  volume: { Mild: 'Mild volume loss',      Moderate: 'Moderate volume loss',      Severe: 'Severe volume loss'      },
  damage: { Mild: 'Mildly damaged hair',   Moderate: 'Moderately damaged hair',   Severe: 'Severely damaged hair'   }
};

/* ─────────────────────────────────────────────
   HEADLINE BUILDER
   Generates e.g. "Mildly dry fine hair",
   "Severely frizzy coarse hair" etc.
───────────────────────────────────────────── */
var HEADLINE_SEV = { mild: 'Mildly', moderate: 'Moderately', severe: 'Severely' };
var HEADLINE_PAIN = {
  dry:    'dry',
  frizzy: 'frizzy',
  growth: 'breakage-prone',
  oily:   'oily-scalp',   // handled specially below
  volume: 'flat',
  damage: 'damaged'
};

function buildHeadline(pain, severity, hairType) {
  var sev  = HEADLINE_SEV[(severity || '').toLowerCase()] || '';
  var ht   = hairType.charAt(0).toUpperCase() + hairType.slice(1).toLowerCase();
  var raw;
  if (pain === 'oily') {
    raw = (sev ? sev + ' ' : '') + ht + ' hair with oily scalp';
  } else {
    var painLabel = HEADLINE_PAIN[pain] || pain;
    raw = (sev ? sev + ' ' : '') + painLabel + ' ' + ht.toLowerCase() + ' hair';
  }
  return raw.replace(/\b\w/g, function(c){ return c.toUpperCase(); });
}

/* ─────────────────────────────────────────────
   SUMMARY COPY
   Keys: SUMMARY_COPY[pain][hairType]
   pain    = lowercase hair_pain_point value
   hairType = 'fine' | 'medium' | 'coarse'

   DRY PATH — production ready
   ALL OTHER PATHS — [DRAFT: review before live]
───────────────────────────────────────────── */
var SUMMARY_COPY = {

  dry: {
    fine:   'Fine strands often feel greasy near the scalp while the lengths stay thirsty. Skip heavy creams that sit on top of the hair. Choose airy hydration that sinks into the fibre so strands stay soft, glossy, and fresh for about three days.',
    medium: 'Medium hair sits in a sweet spot \u2014 not overly oily, not extremely dry. Reach for formulas that absorb rather than coat, so you keep smoothness and calm without flatness. With the right balance, shine can last four to five days.',
    coarse: 'Coarse hair can feel strong, yet the outer cuticle lifts easily and lets moisture escape. Pair penetrating hydration with gentle heat sealing so the surface stays closed. Done consistently, softness and control can hold five days or longer.'
  },

  frizzy: {
    fine:   'On fine hair, frizz usually signals missing moisture \u2014 not a need for heavier cream. Use light leave-ins that absorb into the shaft so the surface stays calm without collapsing lift.',
    medium: 'Medium hair keeps frizz away when two habits work together: moisture that absorbs into the fibre, and a quick heat pass that seals the cuticle after washing. Miss either step and frizz tends to return.',
    coarse: 'Coarse hair needs deeper moisture plus a sealed cuticle. Hydrate from within, then close the surface with controlled heat so humidity has less room to roughen the length.'
  },

  growth: {
    fine:   'Length only stays if ends stop snapping faster than they grow. Keep mid-lengths flexible and protected so new growth is not constantly trimmed away by breakage.',
    medium: 'Growth stalls when ends split before they gain inches. Focus on strength and slip through the lengths so hair can hold onto the growth you are already creating.',
    coarse: 'Coarse ends snap when they dry out and catch. Keep them conditioned and protected so length accumulates instead of breaking off at the tips.'
  },

  oily: {
    fine:   'Fine hair shows oil quickly because more glands sit in a smaller space. The answer is not endless washing \u2014 it is a thorough cleanse plus a smart dry-shampoo rhythm so you can stretch to about three days.',
    medium: 'Medium hair turns oily when residue builds and cleansers cannot fully reset the scalp. Use a clarifying cleanse and lighter styling layers so buildup does not accelerate the next wash.',
    coarse: 'True oiliness is less common on coarse hair; product film is usually the culprit. Strip the buildup cleanly, then switch to lighter formulas so the scalp stays clear longer.'
  },

  volume: {
    fine:   'Fine strands stack flat against each other, which kills lift. Choose airy root support and avoid heavy layers so crown volume reads as soft fullness, not crunch or stickiness.',
    medium: 'Medium hair can hold shape beautifully, but one dense product can flatten everything. Keep the routine light and set volume with technique while the hair cools.',
    coarse: 'Coarse hair often expands sideways instead of upward. Direct lift at the crown and smooth the mid-lengths so volume feels intentional rather than bulky.'
  },

  damage: {
    fine:   'Damage shows as roughness and weak spots along the outer fibre. Rebuild with a targeted repair step and follow with a weekly mask so softness returns wash by wash \u2014 often noticeable from the first use.',
    medium: 'Compromised cuticles make medium hair feel dull and snaggy. A bond-focused treatment plus a nourishing mask restores slip and resilience over a few weeks of steady use.',
    coarse: 'On coarse hair, damage feels like straw and snagging. Repair the fibre surface, then lock in moisture with a weekly mask so strength and polish rebuild together.'
  }

};

/* ─────────────────────────────────────────────
   TESTIMONIALS
───────────────────────────────────────────── */
var TESTIMONIALS = {
  dry: {
    fine:   { text: '\u201cI used to rinse every morning. With this routine I stretch to three days and my ends finally look polished instead of brittle.\u201d', name: '\u2014 Ananya R., verified customer' },
    medium: { text: '\u201cMy scalp was oily and my lengths felt chalky. The cleanse resets everything, and the conditioner actually softens without weighing me down.\u201d', name: '\u2014 Meera K., verified customer' },
    coarse: { text: '\u201cThick, dry hair fought me for years. One wash in and the frizz calmed down \u2014 a month later it still feels smoother every week.\u201d', name: '\u2014 Priya S., verified customer' }
  },
  frizzy: {
    fine:   { text: '\u201cMost anti-frizz products flattened me. This leave-in tames the halo and still leaves my hair looking light.\u201d', name: '\u2014 Rhea M., verified customer' },
    medium: { text: '\u201cHumidity used to undo my whole style. The moisture-plus-seal approach finally keeps the surface calm through the day.\u201d', name: '\u2014 Rhea M., verified customer' },
    coarse: { text: '\u201cI stopped chasing heavy creams. Deeper hydration and a sealed cuticle made the biggest difference for my frizz.\u201d', name: '\u2014 Rhea M., verified customer' }
  },
  growth: {
    fine:   { text: '\u201cI was trimming breakage every month. Protecting my ends changed that \u2014 I am finally keeping the length I grow.\u201d', name: '\u2014 Kabir N., verified customer' },
    medium: { text: '\u201cThe focus on flexible ends made sense immediately. Less snapping, more visible length after a few months.\u201d', name: '\u2014 Kabir N., verified customer' },
    coarse: { text: '\u201cMy tips always frayed first. Keeping them conditioned stopped the cycle so growth actually shows.\u201d', name: '\u2014 Kabir N., verified customer' }
  },
  oily: {
    fine:   { text: '\u201cI used to wash daily. A proper cleanse and dry shampoo got me to day four for the first time.\u201d', name: '\u2014 Ishita P., verified customer' },
    medium: { text: '\u201cBuildup was my real problem, not my scalp alone. Resetting clean made wash days feel so much better.\u201d', name: '\u2014 Ishita P., verified customer' },
    coarse: { text: '\u201cI thought I had an oily scalp \u2014 it was product film. Lighter formulas fixed it fast.\u201d', name: '\u2014 Ishita P., verified customer' }
  },
  volume: {
    fine:   { text: '\u201cI finally have lift at the crown without crunch. People have started noticing my hair again.\u201d', name: '\u2014 Diya A., verified customer' },
    medium: { text: '\u201cDropping heavy stylers and setting volume while my hair cooled changed everything for me.\u201d', name: '\u2014 Diya A., verified customer' },
    coarse: { text: '\u201cI wanted height, not width. Crown lift plus smoother lengths gave me the shape I wanted.\u201d', name: '\u2014 Diya A., verified customer' }
  },
  damage: {
    fine:   { text: '\u201cMy ends looked shredded. After one repair wash the slip came back \u2014 I was genuinely surprised.\u201d', name: '\u2014 Neha V., verified customer' },
    medium: { text: '\u201cBreakage and dullness eased within a couple of weeks of the repair mask routine.\u201d', name: '\u2014 Neha V., verified customer' },
    coarse: { text: '\u201cStraw-like lengths softened quickly once I stopped skipping the weekly repair step.\u201d', name: '\u2014 Neha V., verified customer' }
  }
};

/* ─────────────────────────────────────────────
   MAIN — READ localStorage AND APPLY
───────────────────────────────────────────── */
try {
  var stored = localStorage.getItem('octane_answers');
  if (stored) {
    var answers = JSON.parse(stored);

    // ── Pain point & severity
    var pain     = (answers['hair_pain_point'] || 'dry').toLowerCase();
    var severity = (answers['pain_severity']   || '').toLowerCase();
    var damage   = answers['damage_level']     || '\u2014';
    var heat     = (answers['heat_tools']      || 'none').toLowerCase();
    var volume   = (answers['wants_volume']    || 'none').toLowerCase();

    // ── Hair type — lives inside smart_properties_outputs
    var smartProps = answers['smart_properties_outputs'] || {};
    var hairType   = (smartProps['hair_type'] || 'Fine').toLowerCase();
    if (['fine', 'medium', 'coarse'].indexOf(hairType) === -1) hairType = 'fine'; // safe fallback

    // ── Headline
    document.getElementById('headline').textContent = buildHeadline(pain, severity, hairType);

    // ── Hair type pill
    document.getElementById('val-hairtype').textContent =
      hairType.charAt(0).toUpperCase() + hairType.slice(1);

    // ── Frustration pill
    var sevKey = severity.charAt(0).toUpperCase() + severity.slice(1).toLowerCase();
    var frustrationMap = FRUSTRATION_LABELS[pain] || {};
    var frustrationLabel = frustrationMap[sevKey] || pain;
    document.getElementById('val-frustration').textContent = frustrationLabel.replace(/\b\w/g, function(c){ return c.toUpperCase(); });

    // ── Damage pill
    document.getElementById('val-damage').textContent = damage;

    // ── Heat tools pill
    document.getElementById('val-heat').textContent = HEAT_LABELS[heat] || heat;

    // ── Volume pill
    document.getElementById('val-volume').textContent = VOLUME_LABELS[volume] || 'Smooth & sleek';

    // ── Summary paragraph
    var summaryByPath = SUMMARY_COPY[pain] || SUMMARY_COPY['dry'];
    var summaryText   = summaryByPath[hairType] || summaryByPath['fine'];
    document.getElementById('summary-text').textContent = summaryText;

    // ── Testimonial — keyed by path then hair type
    var testiByPath = TESTIMONIALS[pain] || TESTIMONIALS['dry'];
    var testi = testiByPath[hairType] || testiByPath['fine'];
    document.getElementById('testimonial-text').textContent = testi.text;
    document.getElementById('testimonial-name').textContent = testi.name;
  }
} catch(e) {}

/* ─────────────────────────────────────────────
   NAV SCROLL + ACTIVE STATE
───────────────────────────────────────────── */
function lllScrollTo(id) {
  var el = document.getElementById(id);
  if (el) {
    var top = el.getBoundingClientRect().top + window.scrollY - 52;
    window.scrollTo({ top: top, behavior: 'smooth' });
  }
}

function lllUpdateNav() {
  var ids    = ['profile', 'products', 'routine'];
  var scrollY = window.scrollY + 60;
  var active = 'profile';
  ids.forEach(function(id) {
    var el = document.getElementById('section-' + id);
    if (el && el.getBoundingClientRect().top + window.scrollY <= scrollY) active = id;
  });
  ids.forEach(function(id) {
    var nav = document.getElementById('lll-nav-' + id);
    if (!nav) return;
    var idx       = ids.indexOf(id);
    var activeIdx = ids.indexOf(active);
    nav.classList.toggle('active', id === active);
    nav.classList.toggle('done',   idx < activeIdx);
  });
}
window.addEventListener('scroll', lllUpdateNav, { passive: true });

/* ─────────────────────────────────────────────
   FIX OCTANE TOP PADDING — survives re-renders
───────────────────────────────────────────── */
function lllFixPadding() {
  var outer = document.getElementById('octane-quiz-outer-wrapper');
  if (outer) outer.style.setProperty('padding-top', '0', 'important');
}
lllFixPadding();
setTimeout(lllFixPadding, 100);
setTimeout(lllFixPadding, 500);
setTimeout(lllFixPadding, 1000);
</script>
</body>
</html>
